# XcodeGen spec — `brew install xcodegen && cd ios && xcodegen` produces
# BentoHost.xcodeproj. The project file is generated, never committed, so it
# can't rot into a merge-conflict magnet the way .pbxproj does.
name: BentoHost
options:
  bundleIdPrefix: page.bento
  deploymentTarget:
    iOS: "16.0"   # WKURLSchemeHandler + modern UIDocumentBrowser behaviour
targets:
  BentoHost:
    type: application
    platform: iOS
    sources:
      - path: BentoHost
    settings:
      base:
        INFOPLIST_FILE: BentoHost/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: page.bento.host
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        SWIFT_VERSION: "5.0"
